name: Lesson or program issue
description: Report confusing text, an incorrect output or a failing example
title: "[Learning issue] "
body:
  - type: input
    id: location
    attributes:
      label: Module and file
      description: Include the topic number and function or exercise name.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps and input
      description: Include compiler version, EVM target, exact calls and input values.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and observed behavior
    validations:
      required: true
